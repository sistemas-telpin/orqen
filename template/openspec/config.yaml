# Configuración de OpenSpec para el proceso REC.
# Si ya corriste `openspec init`, fusioná `context` y `rules` con tu config.yaml.
schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Este repo procesa requerimientos de clientes (REC) de Jira. Cada change corresponde a un REC
  y su nombre empieza con la key del REC (ej. rec-123-exportar-facturas).

rules:
  proposal:
    - En "Why" citá la key del REC y el problema de negocio del cliente.
    - Incluí una sección "Fuera de alcance" dentro de "What Changes".
  specs:
    - Cada criterio de aceptación del análisis del REC debe tener al menos un Scenario con WHEN/THEN.
    - Los escenarios describen comportamiento observable, verificable con un test automático.
  tasks:
    - Cada tarea termina con su estimación en horas entre paréntesis, ej. "(4h)". Máximo 8h por tarea.
    - Incluí tareas explícitas de tests automáticos por escenario y de documentación.

operations:
  apply:
    guidance:
      - Escribí un test por Scenario y nombralo de forma que se reconozca el escenario.
      - Tildá cada tarea en tasks.md al terminarla. No hagas commits; los hace el proceso REC.
  archive:
    guidance:
      - El archivado lo ejecuta el proceso REC en la etapa DELIVERY; los agentes no archivan.
