# Tool: everything orqen needs to create and run a Java web app on Tomcat with SQL Server.
id: java-tomcat-sqlserver
nombre: Java + Tomcat + SQL Server
descripcion: Java 17 web app (WAR, Jakarta Servlet) on Tomcat 10 started by Maven (Cargo), Flyway migrations and SQL Server in Docker.
requisitos:
  - { comando: java, version: ">=17", ayuda: "Install a JDK 17 or later (e.g. Eclipse Temurin)" }
  - { comando: mvn, ayuda: "Install Apache Maven 3.9 or later" }
  - { comando: node, version: ">=20.12", ayuda: "orqen and orqen/tools/db.mjs need Node 20.12 or later" }
  - { comando: docker, ayuda: "SQL Server runs in Docker: install Docker Desktop (Windows/macOS) or Docker Engine (Linux)" }
parametros:
  - { id: PAQUETE, pregunta: "Java package", tipo: paquete_java, defecto: "com.telpin.{{PROYECTO_JAVA}}" }
  - { id: PUERTO_DB, pregunta: "SQL Server port", tipo: puerto, defecto: 1433 }
  - { id: PUERTO_APP, pregunta: "Tomcat port", tipo: puerto, defecto: 8080 }
scaffold:
  - copiar: scaffold
tools:
  - _shared/db.mjs
db:
  engine: sqlserver
  port: {{PUERTO_DB}}
  database: "{{PROYECTO_JAVA}}"
  user: sa
  password: "{{DB_PASSWORD}}"
stack:
  resumen: "{{PROYECTO}}: Java 17 web app (WAR) on Tomcat 10, Flyway migrations and SQL Server (Docker, orqen/tools/db.mjs)."
  gestor_paquetes: maven
  componentes:
    - { nombre: app, tipo: backend, ruta: ".", lenguaje: java, framework: "jakarta-servlet+tomcat", puerto: {{PUERTO_APP}}, comandos: { dev: "mvn -q package cargo:run -DskipTests", build: "mvn -q package -DskipTests", tests: "mvn -q test" } }
  servicios:
    - { nombre: db, tipo: sqlserver, puerto: {{PUERTO_DB}}, motivo: "orqen/tools/db.mjs (Docker)" }
  migraciones: mvn -q flyway:migrate
entornos:
  procesos:
    - { nombre: db, comando: node orqen/tools/db.mjs up, detener: node orqen/tools/db.mjs down, listo_si: "orqen-db: ready", cuando: siempre, espera_seg: 300 }
    - { nombre: app, comando: "mvn -q package cargo:run -DskipTests", puerto: {{PUERTO_APP}}, url: "http://localhost:{{PUERTO_APP}}/health", cuando: siempre, espera_seg: 600 }
  variables:
    DB_URL: "jdbc:sqlserver://localhost:{{PUERTO_DB}};databaseName={{PROYECTO_JAVA}};encrypt=true;trustServerCertificate=true"
    DB_USER: sa
    DB_PASSWORD: "{{DB_PASSWORD}}"
    FLYWAY_URL: "jdbc:sqlserver://localhost:{{PUERTO_DB}};databaseName={{PROYECTO_JAVA}};encrypt=true;trustServerCertificate=true"
    FLYWAY_USER: sa
    FLYWAY_PASSWORD: "{{DB_PASSWORD}}"
    APP_URL: "http://localhost:{{PUERTO_APP}}"
  preparar:
    - mvn -q -DskipTests dependency:go-offline
  migrar:
    - mvn -q flyway:migrate
  tests:
    unitarios: mvn -q test
    integracion: mvn -q verify -Dskip.unit=true
