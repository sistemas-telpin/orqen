name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify package
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run prepublishOnly
          npm pack --dry-run
      - name: Publish package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match cli/package.json ($package_version)."
            exit 1
          fi
          npm publish # prepublishOnly verifies and prepack builds the CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
