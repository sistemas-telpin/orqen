# orqen configuration for the 9-step flow: project, connectors (where the tickets live) and workflow. Edit as needed.
# Tokens never go here: they live in ~/.orqen/credentials.env. How the project starts is in orqen/environment.yaml.
version: 1
orqen:
  cli: 0.1.9
  kit: 0.1.8
project:
  name: orqen
  base_branch: main
agent:
  command: claude -p --permission-mode acceptEdits
openspec:
  install: global
  version: 2.1.0
  tools:
    - claude
    - codex
workflow:
  support: false
  approvers:
    analysis: []
    qa: []
    code: []
    client: []
    execution: []
  code_review:
    gate: github
    reviewers: []
  devel_branch: desarrollo
