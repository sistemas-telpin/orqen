name: app
# Builds the ORQEN desktop app (app/, Rust + GPUI) for each platform and attaches it to the release of the tag,
# where `orqen` downloads it from. Nobody needs Rust or a C++ toolchain on their machine.
on:
  push:
    tags: ["v*"]
  pull_request: # test build on every PR that touches the app: the packages stay as artifacts of the run
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch: # manual run: the packages stay as artifacts of the run

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64, triple: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: darwin-arm64, triple: aarch64-apple-darwin }
          - { os: macos-latest, target: darwin-x64, triple: x86_64-apple-darwin }   # cross-compiled on Apple Silicon
          - { os: ubuntu-22.04, target: linux-x64, triple: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libfreetype-dev libvulkan-dev libx11-xcb-dev libxcb-xkb-dev libzstd-dev
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Build and package (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./scripts/package.sh ${{ matrix.target }} ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: orqen-app-${{ matrix.target }}
          path: app/dist/orqen-app-${{ matrix.target }}.tar.gz
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/orqen-app-${{ matrix.target }}.tar.gz
